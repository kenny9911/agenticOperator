# Overlay for SHARED-Inngest deployments: attaches AO containers to an
# existing external Docker network so AO reaches the shared Inngest and
# partner services by unambiguous container names. There are deliberately no
# network-name or callback-alias defaults: production must state the topology
# it intends to join.
#
# `scripts/deploy-compose.sh` includes this overlay automatically when the
# authoritative env file contains DEPLOY_MODE=shared.
#
# Pair it with these .env.deploy settings:
#   DEPLOY_MODE=shared
#   COMPOSE_PROFILES=                                   # bundled inngest OFF
#   INNGEST_BASE_URL=http://raas-inngest:8288           # shared instance
#   AO_SHARED_NETWORK_ALIAS=ao-v2-app
#   INNGEST_SERVE_ORIGIN=http://ao-v2-app:3002          # same alias
#   RAAS_SHARED_NETWORK=raas-deploy-next_default
#   RAAS_POSTGRES_URL=postgresql://user:pass@postgres:5432/raas

services:
  app:
    networks:
      default:
      raas-shared:
        # Distinctive alias: "app" would be ambiguous on a shared network.
        aliases:
          - "${AO_SHARED_NETWORK_ALIAS:?AO_SHARED_NETWORK_ALIAS is required in shared mode}"
  archiver:
    networks:
      default:
      raas-shared: {}
  monitor-sweeper:
    networks:
      default:
      raas-shared: {}

networks:
  raas-shared:
    external: true
    name: ${RAAS_SHARED_NETWORK:?RAAS_SHARED_NETWORK is required in shared mode}
