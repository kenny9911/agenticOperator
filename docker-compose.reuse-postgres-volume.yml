# DANGEROUS, EXPLICIT OPT-IN: mount an existing AO PostgreSQL volume into the
# new deployment instead of creating <COMPOSE_PROJECT_NAME>-postgres-data.
#
# Prefer the documented pg_dump/restore path, which leaves the old volume
# untouched for rollback. Use this overlay only after verifying PostgreSQL
# major version, data directory, credentials and the exact volume name, then
# stopping the old app AND old postgres container. Never mount one PGDATA into
# two running PostgreSQL containers.
#
# Required environment:
#   AO_POSTGRES_VOLUME_MODE=external
#   AO_EXISTING_POSTGRES_VOLUME=ao-postgres_ao-pgdata
#   DATABASE_SCHEMA_SYNC=0

volumes:
  ao-postgres-data:
    external: true
    name: ${AO_EXISTING_POSTGRES_VOLUME:?AO_EXISTING_POSTGRES_VOLUME is required}
